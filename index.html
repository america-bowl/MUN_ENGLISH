<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123b68">
  <title>MUN ENGLISH — Vocabulary Manager</title>
  <link rel="manifest" href="manifest.json">
  <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script> PDF parsing logic is removed -->
  <style>
    :root {
      color-scheme: light;
      --navy: #123b68;
      --blue: #1769aa;
      --blue-soft: #eaf3fb;
      --bg: #f4f7fb;
      --card: #fff;
      --ink: #182433;
      --muted: #64748b;
      --border: #d9e2ed;
      --danger: #b42318;
      --danger-soft: #fff0ef;
      --green: #167647;
      --shadow: 0 7px 24px rgba(20, 49, 80, .07);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:22px; }
    .brandline { display:flex; align-items:center; gap:12px; }
    .brandmark { width:46px; height:46px; display:grid; place-items:center; color:#fff; background:var(--navy); border-radius:13px; font-size:24px; box-shadow:var(--shadow); }
    h1 { margin:0; font-size:clamp(25px, 4vw, 34px); letter-spacing:-.04em; line-height:1.15; }
    .subtitle { margin:7px 0 0; color:var(--muted); }
    .offline-note { flex:0 0 auto; padding:8px 12px; border:1px solid var(--border); border-radius:999px; background:#fff; color:var(--muted); font-size:12px; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin:16px 0; box-shadow:var(--shadow); }
    .panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:14px; }
    h2 { margin:0; font-size:18px; }
    h3 { margin:0 0 10px; font-size:14px; }
    .muted { color:var(--muted); }
    .small { font-size:12px; }
    .actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:40px; padding:9px 13px; border:1px solid var(--border); border-radius:9px; background:#fff; color:var(--ink); font-weight:650; text-decoration:none; transition:background .15s, border-color .15s, transform .15s; }
    .btn:hover:not(:disabled) { background:#f7fafc; border-color:#b8c8d9; }
    .btn-primary { background:var(--blue); color:#fff; border-color:var(--blue); }
    .btn-primary:hover:not(:disabled) { background:var(--navy); color:#fff; }
    .btn-danger { color:var(--danger); background:var(--danger-soft); border-color:#f4c6c2; }
    .btn-danger:hover:not(:disabled) { background:#ffe3e0; }
    .btn-quiet { background:transparent; }
    .file-label { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:40px; padding:9px 13px; border:1px solid var(--border); border-radius:9px; background:#fff; font-weight:650; cursor:pointer; }
    .file-label:hover { background:#f7fafc; }
    input[type="file"] { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; }
    .file-label:focus-within { outline:3px solid #b9daf7; outline-offset:2px; }
    .status { margin:12px 0 0; min-height:1.5em; color:var(--muted); overflow-wrap:anywhere; }
    .status.error { color:var(--danger); }
    .status.success { color:var(--green); }
    .control-grid { display:grid; grid-template-columns:minmax(220px, 1.6fr) minmax(160px, .8fr) minmax(150px, .7fr); gap:10px; }
    .field { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .field label, .field-label { font-size:12px; font-weight:750; color:#42536a; }
    .control, .field input, .field textarea, .field select { width:100%; min-height:42px; padding:10px 12px; background:#fff; border:1px solid #cbd6e2; border-radius:9px; color:var(--ink); }
    .field textarea { min-height:112px; resize:vertical; }
    .control:focus, .field input:focus, .field textarea:focus, .field select:focus { outline:3px solid #cfe5fa; border-color:var(--blue); }
    .countline { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:12px; color:var(--muted); font-size:13px; }
    .bulkbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding-top:14px; margin-top:14px; border-top:1px solid var(--border); }
    .checkline { display:inline-flex; align-items:center; gap:8px; font-weight:650; font-size:13px; }
    input[type="checkbox"] { width:17px; height:17px; accent-color:var(--blue); }
    .bulkbar .control { width:auto; min-width:190px; min-height:38px; padding:7px 10px; }
    .word-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap:14px; margin-top:16px; }
    .word-card { min-width:0; display:flex; flex-direction:column; padding:17px; background:#fff; border:1px solid var(--border); border-radius:14px; box-shadow:0 3px 13px rgba(20,49,80,.035); }
    .card-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
    .card-top-left { display:flex; align-items:center; gap:9px; min-width:0; }
    .pill { display:inline-flex; align-items:center; max-width:100%; padding:4px 9px; border-radius:999px; background:var(--blue-soft); color:var(--navy); font-size:11px; font-weight:750; overflow-wrap:anywhere; }
    .word-term { font-size:22px; line-height:1.25; font-weight:820; letter-spacing:-.025em; overflow-wrap:anywhere; }
    .word-meaning { margin-top:10px; color:#3b4b5f; white-space:pre-wrap; overflow-wrap:anywhere; }
    .tag-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
    .tag { padding:3px 8px; border:1px solid var(--border); border-radius:7px; color:#516277; background:#f8fafc; font-size:11px; }
    .card-meta { margin-top:14px; padding-top:11px; border-top:1px solid #edf1f5; font-size:11px; color:var(--muted); overflow-wrap:anywhere; }
    .card-actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:14px; }
    .card-actions .btn { min-height:34px; padding:6px 10px; font-size:12px; }
    .empty-state { grid-column:1/-1; padding:42px 20px; text-align:center; background:#fff; border:1px dashed #b9c8d8; border-radius:14px; color:var(--muted); }
    .empty-icon { margin-bottom:7px; font-size:30px; }
    dialog { width:min(620px, calc(100% - 24px)); max-height:calc(100% - 32px); padding:0; border:1px solid var(--border); border-radius:16px; box-shadow:0 24px 80px rgba(10,30,50,.25); color:var(--ink); }
    dialog::backdrop { background:rgba(12,25,40,.48); backdrop-filter:blur(2px); }
    .dialog-head { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:20px 22px 14px; border-bottom:1px solid var(--border); }
    .dialog-body { display:grid; gap:14px; padding:20px 22px; overflow-y:auto; }
    .dialog-footer { display:flex; justify-content:flex-end; gap:8px; padding:14px 22px 20px; border-top:1px solid var(--border); }
    .toast { position:fixed; z-index:20; left:50%; bottom:22px; transform:translate(-50%, 20px); display:flex; align-items:center; gap:14px; width:max-content; max-width:calc(100% - 28px); padding:12px 14px; border-radius:12px; background:#142b43; color:#fff; box-shadow:0 10px 35px rgba(0,0,0,.22); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
    .toast.visible { opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
    .toast button { color:#fff; background:transparent; border:1px solid #8ca3ba; border-radius:7px; padding:5px 9px; font-weight:750; }
    .toast button[hidden] { display:none; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:760px) {
      .shell { width:calc(100% - 20px); padding-top:18px; }
      .hero { flex-direction:column; gap:12px; }
      .offline-note { align-self:flex-start; }
      .panel { padding:15px; border-radius:13px; }
      .control-grid { grid-template-columns:1fr; }
      .countline { align-items:flex-start; flex-direction:column; gap:3px; }
      .word-grid { grid-template-columns:1fr; }
      .bulkbar .control { width:100%; }
      .bulkbar .btn { flex:1; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <div class="brandline"><div class="brandmark" aria-hidden="true">M</div><h1>MUN ENGLISH</h1></div>
        <p class="subtitle">MUN vocabulary workspace — collect, edit, sort and review.</p>
      </div>
      <div class="offline-note">Local-first · IndexedDB保存</div>
    </header>

    <section class="panel" aria-labelledby="ingestTitle">
      <div class="panel-head">
        <div><h2 id="ingestTitle">単語を追加する</h2><p class="muted small">テキストを貼り付けてAI抽出するか、手動で単語を登録できます。</p></div>
        <button class="btn btn-primary" id="addWordButton" type="button">＋ 手動で追加</button>
      </div>
      
      <div class="field" style="flex-grow: 1; min-width: 100%; margin-bottom: 15px;">
        <label for="textInput">テキストをペーストしてAI解析：</label>
        <textarea id="textInput" class="control" rows="5" placeholder="ここに英語のテキスト（PDFのコピペ等）を貼り付けてください..."></textarea>
        <button class="btn btn-primary" id="extractWordsBtn" type="button" style="margin-top: 8px;">AIで単語を抽出</button>
      </div>

      <div class="actions">
        <button class="btn" id="exportJsonButton" type="button">JSONバックアップ</button>
        <label class="file-label" for="jsonInput">JSONをインポート<input type="file" id="jsonInput" accept=".json,application/json"></label>
        <button class="btn" id="exportCsvButton" type="button">CSVを書き出す</button>
      </div>
      <p id="pdfStatus" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="panel" aria-labelledby="organizeTitle">
      <div class="panel-head">
        <div><h2 id="organizeTitle">単語を整理する</h2><p class="muted small">検索・カテゴリ絞り込み・並び替え・編集・一括削除に対応。</p></div>
      </div>
      <div class="control-grid">
        <div class="field"><label for="searchInput">検索</label><input class="control" id="searchInput" type="search" placeholder="英単語・意味・タグ・出典で検索" autocomplete="off"></div>
        <div class="field"><label for="categoryFilter">カテゴリ</label><select id="categoryFilter" class="control"><option value="all">すべてのカテゴリ</option></select></div>
        <div class="field"><label for="sortSelect">並び順</label><select id="sortSelect" class="control"><option value="newest">追加した順（新しい順）</option><option value="oldest">追加した順（古い順）</option><option value="term-asc">英単語 A → Z</option><option value="term-desc">英単語 Z → A</option></select></div>
      </div>
      <div class="countline"><span id="resultCount" aria-live="polite">読み込み中…</span><button id="clearFiltersButton" class="btn btn-quiet" type="button">検索条件をリセット</button></div>
      <div class="bulkbar">
        <label class="checkline"><input id="selectAllCheckbox" type="checkbox"> 表示中を全選択</label>
        <span id="selectionCount" class="muted small">選択中 0 件</span>
        <label class="sr-only" for="bulkCategory">選択した単語の移動先カテゴリ</label>
        <select id="bulkCategory" class="control"><option value="">カテゴリを選択して移動</option></select>
        <button class="btn" id="moveSelectedButton" type="button" disabled>カテゴリ変更</button>
        <button class="btn btn-danger" id="deleteSelectedButton" type="button" disabled>選択した単語を削除</button>
      </div>
    </section>

    <section aria-label="単語一覧">
      <div id="cardGrid" class="word-grid" aria-live="polite"></div>
    </section>
  </main>

  <dialog id="wordDialog" aria-labelledby="dialogTitle">
    <form id="wordForm">
      <div class="dialog-head"><h2 id="dialogTitle">単語を追加</h2><button type="button" class="btn btn-quiet" id="closeDialogButton" aria-label="閉じる">✕</button></div>
      <input type="hidden" id="wordId">
      <div class="dialog-body">
        <div class="field"><label for="termInput">英単語・熟語 *</label><input id="termInput" maxlength="180" required autocomplete="off" placeholder="e.g. notwithstanding"></div>
        <div class="field"><label for="meaningInput">意味・説明 *</label><textarea id="meaningInput" required maxlength="8000" placeholder="意味、使い方、例文など"></textarea></div>
        <div class="field"><label for="wordCategoryInput">カテゴリ</label><input id="wordCategoryInput" list="categoryList" maxlength="80" placeholder="e.g. International Law"><datalist id="categoryList"></datalist></div>
        <div class="field"><label for="tagsInput">タグ（カンマ区切り）</label><input id="tagsInput" maxlength="300" placeholder="UN, debate, high-priority"></div>
        <div class="field"><label for="sourceInput">出典・メモ（任意）</label><input id="sourceInput" maxlength="300" placeholder="e.g. UN Charter / PDF名"></div>
        <p class="muted small">カテゴリとタグは後から変更できます。保存先はこのブラウザのローカルデータベースです。</p>
      </div>
      <div class="dialog-footer"><button type="button" class="btn" id="cancelDialogButton">キャンセル</button><button type="submit" class="btn btn-primary">保存する</button></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMessage"></span><button id="undoButton" type="button" hidden>元に戻す</button></div>

  <script>
    'use strict';
    const DB_NAME = 'MunEnglishDB';
    const DB_VERSION = 1; // 既存のカードデータとの互換性を維持
    let db;
    let cardsCache = [];
    let selectedIds = new Set();
    let undoCards = [];

    const $ = (id) => document.getElementById(id);
    const makeId = () => `card-${Date.now()}-${(window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2)}`;
    const cleanText = (value) => String(value ?? '').trim();
    const normalizeTerm = (value) => cleanText(value).toLocaleLowerCase().replace(/\s+/g, ' ');
    const cardDuplicateKey = (card) => `${normalizeTerm(card.term)}\u0000${normalizeTerm(card.meaning)}`;
    const formatDate = (value) => {
      if (!value) return '';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? '' : date.toLocaleDateString('ja-JP');
    };
    const normalizeTags = (value) => {
      const raw = Array.isArray(value) ? value : cleanText(value).split(',');
      return [...new Set(raw.map((tag) => cleanText(tag)).filter(Boolean))];
    };
    function normalizeCard(source) {
      const item = source && typeof source === 'object' ? source : {};
      return {
        id: cleanText(item.id) || makeId(),
        term: cleanText(item.term ?? item.en ?? item.word),
        meaning: cleanText(item.meaning ?? item.ja ?? item.definition),
        category: cleanText(item.category) || '未分類',
        tags: normalizeTags(item.tags),
        sourceName: cleanText(item.sourceName ?? item.source) || '手動登録',
        sourcePage: item.sourcePage ?? null,
        createdAt: item.createdAt || new Date().toISOString(),
        updatedAt: item.updatedAt || null
      };
    }

    function requestResult(request) {
      return new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('データの読み込みに失敗しました。'));
      });
    }
    function transactionFinished(transaction) {
      return new Promise((resolve, reject) => {
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error || new Error('データベース処理に失敗しました。'));
        transaction.onabort = () => reject(transaction.error || new Error('データベース処理が中断されました。'));
      });
    }
    function initDB() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) {
          reject(new Error('このブラウザはIndexedDBに対応していません。'));
          return;
        }
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (event) => {
          const database = event.target.result;
          if (!database.objectStoreNames.contains('cards')) {
            const store = database.createObjectStore('cards', { keyPath: 'id' });
            store.createIndex('term', 'term', { unique: false });
          }
        };
        request.onsuccess = (event) => { db = event.target.result; resolve(db); };
        request.onerror = () => reject(request.error || new Error('データベースを開けませんでした。'));
        request.onblocked = () => reject(new Error('別のタブがデータベースを使用中です。ほかのタブを閉じて再読み込みしてください。'));
      });
    }
    async function getAllCards() {
      const transaction = db.transaction('cards', 'readonly');
      return (await requestResult(transaction.objectStore('cards').getAll())).map(normalizeCard).filter((card) => card.term);
    }
    async function putCardRecords(cards) {
      if (!cards.length) return;
      const transaction = db.transaction('cards', 'readwrite');
      const finished = transactionFinished(transaction);
      const store = transaction.objectStore('cards');
      cards.forEach((card) => store.put(card));
      await finished;
    }
    async function putCardRecord(card) {
      await putCardRecords([card]);
    }
    async function deleteCardRecords(ids) {
      const transaction = db.transaction('cards', 'readwrite');
      const finished = transactionFinished(transaction);
      const store = transaction.objectStore('cards');
      ids.forEach((id) => store.delete(id));
      await finished;
    }

    function currentCategoryNames() {
      return [...new Set(cardsCache.map((card) => card.category || '未分類'))].sort((a, b) => a.localeCompare(b, 'ja'));
    }
    function updateCategoryOptions() {
      const active = $('categoryFilter').value || 'all';
      const categories = currentCategoryNames();
      $('categoryFilter').replaceChildren(new Option('すべてのカテゴリ', 'all'));
      categories.forEach((category) => $('categoryFilter').add(new Option(category, category)));
      $('categoryFilter').value = categories.includes(active) ? active : 'all';
      $('bulkCategory').replaceChildren(new Option('カテゴリを選択して移動', ''));
      $('categoryList').replaceChildren();
      categories.forEach((category) => {
        $('bulkCategory').add(new Option(category, category));
        const option = document.createElement('option');
        option.value = category;
        $('categoryList').append(option);
      });
    }
    function getFilteredCards() {
      const query = normalizeTerm($('searchInput').value);
      const category = $('categoryFilter').value;
      const sort = $('sortSelect').value;
      const filtered = cardsCache.filter((card) => {
        if (category !== 'all' && card.category !== category) return false;
        if (!query) return true;
        const haystack = [card.term, card.meaning, card.category, card.sourceName, ...card.tags].join(' ').toLocaleLowerCase();
        return haystack.includes(query);
      });
      filtered.sort((a, b) => {
        if (sort === 'term-asc') return a.term.localeCompare(b.term, 'en', { sensitivity: 'base' });
        if (sort === 'term-desc') return b.term.localeCompare(a.term, 'en', { sensitivity: 'base' });
        const aDate = new Date(a.createdAt || 0).getTime() || 0;
        const bDate = new Date(b.createdAt || 0).getTime() || 0;
        return sort === 'oldest' ? aDate - bDate : bDate - aDate;
      });
      return filtered;
    }
    function makeButton(label, className, onClick) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `btn ${className || ''}`.trim();
      button.textContent = label;
      button.addEventListener('click', onClick);
      return button;
    }
    function updateSelectionControls(visibleCards = getFilteredCards()) {
      const visibleIds = visibleCards.map((card) => card.id);
      const visibleSelected = visibleIds.filter((id) => selectedIds.has(id)).length;
      $('selectionCount').textContent = `選択中 ${selectedIds.size} 件`;
      $('deleteSelectedButton').disabled = selectedIds.size === 0;
      $('moveSelectedButton').disabled = selectedIds.size === 0 || !$('bulkCategory').value;
      $('selectAllCheckbox').checked = visibleIds.length > 0 && visibleSelected === visibleIds.length;
      $('selectAllCheckbox').indeterminate = visibleSelected > 0 && visibleSelected < visibleIds.length;
    }
    function renderCards() {
      const visibleCards = getFilteredCards();
      const grid = $('cardGrid');
      grid.replaceChildren();
      $('resultCount').textContent = `${visibleCards.length} 件表示 / 全 ${cardsCache.length} 件`;
      if (visibleCards.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        const icon = document.createElement('div'); icon.className = 'empty-icon'; icon.textContent = cardsCache.length ? '⌕' : '📚';
        const title = document.createElement('strong'); title.textContent = cardsCache.length ? '条件に合う単語がありません' : 'まだ単語が登録されていません';
        const detail = document.createElement('p'); detail.className = 'muted'; detail.textContent = cardsCache.length ? '検索語やカテゴリを変えてみてください。' : 'AI解析か「手動で追加」から、最初の単語を登録しましょう。';
        empty.append(icon, title, detail); grid.append(empty);
        updateSelectionControls(visibleCards);
        return;
      }
      visibleCards.forEach((card) => {
        const article = document.createElement('article'); article.className = 'word-card';
        const top = document.createElement('div'); top.className = 'card-top';
        const topLeft = document.createElement('div'); topLeft.className = 'card-top-left';
        const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = selectedIds.has(card.id); checkbox.setAttribute('aria-label', `「${card.term}」を選択`);
        checkbox.addEventListener('change', () => { checkbox.checked ? selectedIds.add(card.id) : selectedIds.delete(card.id); updateSelectionControls(); });
        const category = document.createElement('span'); category.className = 'pill'; category.textContent = card.category || '未分類';
        topLeft.append(checkbox, category); top.append(topLeft);
        const term = document.createElement('div'); term.className = 'word-term'; term.textContent = card.term;
        const meaning = document.createElement('div'); meaning.className = 'word-meaning'; meaning.textContent = card.meaning || '（意味未登録）';
        article.append(top, term, meaning);
        if (card.tags.length) {
          const tags = document.createElement('div'); tags.className = 'tag-row';
          card.tags.forEach((tagText) => { const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = `# ${tagText}`; tags.append(tag); });
          article.append(tags);
        }
        const meta = document.createElement('div'); meta.className = 'card-meta';
        const source = card.sourceName || '手動登録';
        meta.textContent = `${source}${card.sourcePage ? ` · p.${card.sourcePage}` : ''}${card.createdAt ? ` · ${formatDate(card.createdAt)}登録` : ''}`;
        article.append(meta);
        const actions = document.createElement('div'); actions.className = 'card-actions';
        actions.append(makeButton('編集', '', () => openWordDialog(card.id)));
        actions.append(makeButton('削除', 'btn-danger', () => deleteCard(card.id)));
        article.append(actions); grid.append(article);
      });
      updateSelectionControls(visibleCards);
    }
    async function refreshCards({ clearSelection = false } = {}) {
      cardsCache = await getAllCards();
      if (clearSelection) selectedIds.clear();
      const existingIds = new Set(cardsCache.map((card) => card.id));
      selectedIds = new Set([...selectedIds].filter((id) => existingIds.has(id)));
      updateCategoryOptions();
      renderCards();
    }

    let toastTimerId;
    function showToast(message, canUndo = false) {
      $('toastMessage').textContent = message;
      $('undoButton').hidden = !canUndo;
      $('toast').classList.add('visible');
      clearTimeout(toastTimerId);
      toastTimerId = setTimeout(() => $('toast').classList.remove('visible'), 7000);
    }
    function openWordDialog(id = '') {
      const card = id ? cardsCache.find((item) => item.id === id) : null;
      $('wordForm').reset();
      $('wordId').value = card?.id || '';
      $('dialogTitle').textContent = card ? '単語を編集' : '単語を追加';
      $('termInput').value = card?.term || '';
      $('meaningInput').value = card?.meaning || '';
      const filterCategory = $('categoryFilter').value;
      $('wordCategoryInput').value = card?.category || (filterCategory !== 'all' ? filterCategory : '未分類');
      $('tagsInput').value = card?.tags?.join(', ') || '';
      $('sourceInput').value = card?.sourceName || (card ? '' : '手動登録');
      $('wordDialog').showModal();
      $('termInput').focus();
    }
    async function saveWord(event) {
      event.preventDefault();
      const id = $('wordId').value;
      const original = id ? cardsCache.find((card) => card.id === id) : null;
      const card = normalizeCard({
        id: original?.id || makeId(),
        term: $('termInput').value,
        meaning: $('meaningInput').value,
        category: $('wordCategoryInput').value || '未分類',
        tags: $('tagsInput').value,
        sourceName: $('sourceInput').value || (original?.sourceName ?? '手動登録'),
        sourcePage: original?.sourcePage ?? null,
        createdAt: original?.createdAt || new Date().toISOString(),
        updatedAt: new Date().toISOString()
      });
      if (!card.term || !card.meaning) return;
      const duplicate = cardsCache.find((other) => other.id !== card.id && cardDuplicateKey(other) === cardDuplicateKey(card));
      if (duplicate && !window.confirm(`「${duplicate.term}」は同じ意味ですでに登録されています。それでも保存しますか？`)) return;
      try {
        await putCardRecord(card);
        $('wordDialog').close();
        await refreshCards({ clearSelection: true });
        showToast(original ? '単語を更新しました。' : '単語を追加しました。');
      } catch (error) {
        console.error(error); showToast(`保存できませんでした: ${error.message}`);
      }
    }
    async function deleteCard(id) {
      const card = cardsCache.find((item) => item.id === id);
      if (!card) return;
      if (!window.confirm(`「${card.term}」を削除しますか？\n削除後7秒間は「元に戻す」で復元できます。`)) return;
      try {
        await deleteCardRecords([id]);
        undoCards = [card];
        selectedIds.delete(id);
        await refreshCards();
        showToast('単語を削除しました。', true);
      } catch (error) { console.error(error); showToast(`削除できませんでした: ${error.message}`); }
    }
    async function deleteSelectedCards() {
      const selected = cardsCache.filter((card) => selectedIds.has(card.id));
      if (!selected.length) return;
      if (!window.confirm(`選択した ${selected.length} 件の単語を削除しますか？\n削除後7秒間は「元に戻す」で復元できます。`)) return;
      try {
        undoCards = selected;
        await deleteCardRecords(selected.map((card) => card.id));
        selectedIds.clear();
        await refreshCards({ clearSelection: true });
        showToast(`${selected.length} 件を削除しました。`, true);
      } catch (error) { console.error(error); showToast(`削除できませんでした: ${error.message}`); }
    }
    async function undoDelete() {
      if (!undoCards.length) return;
      const restoring = [...undoCards];
      try {
        await putCardRecords(restoring);
        undoCards = [];
        await refreshCards({ clearSelection: true });
        $('toast').classList.remove('visible');
        showToast(`${restoring.length} 件を復元しました。`);
      } catch (error) { console.error(error); showToast(`復元できませんでした: ${error.message}`); }
    }
    async function moveSelectedCards() {
      const category = cleanText($('bulkCategory').value);
      const selected = cardsCache.filter((card) => selectedIds.has(card.id));
      if (!category || !selected.length) return;
      try {
        await putCardRecords(selected.map((card) => ({ ...card, category, updatedAt: new Date().toISOString() })));
        selectedIds.clear();
        await refreshCards({ clearSelection: true });
        showToast(`${selected.length} 件を「${category}」に移動しました。`);
      } catch (error) { console.error(error); showToast(`カテゴリを変更できませんでした: ${error.message}`); }
    }
    function clearFilters() {
      $('searchInput').value = '';
      $('categoryFilter').value = 'all';
      $('sortSelect').value = 'newest';
      selectedIds.clear();
      renderCards();
    }
    function downloadBlob(filename, blob) {
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url; anchor.download = filename; anchor.style.display = 'none';
      document.body.append(anchor); anchor.click(); anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    async function exportJSON() {
      try {
        const cards = await getAllCards();
        const payload = { app: 'MUN_ENGLISH', schemaVersion: 2, exportedAt: new Date().toISOString(), cards };
        downloadBlob(`MUN_English_Backup_${new Date().toISOString().slice(0, 10)}.json`, new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' }));
        showToast(`${cards.length} 件をJSONバックアップしました。`);
      } catch (error) { console.error(error); showToast(`書き出しに失敗しました: ${error.message}`); }
    }
    function csvCell(value) { return `"${String(value ?? '').replace(/"/g, '""')}"`; }
    async function exportCSV() {
      try {
        const cards = await getAllCards();
        const rows = [['term', 'meaning', 'category', 'tags', 'sourceName', 'sourcePage', 'createdAt', 'updatedAt'], ...cards.map((card) => [card.term, card.meaning, card.category, card.tags.join(', '), card.sourceName, card.sourcePage ?? '', card.createdAt, card.updatedAt ?? ''])];
        const csv = '\uFEFF' + rows.map((row) => row.map(csvCell).join(',')).join('\r\n');
        downloadBlob(`MUN_English_Words_${new Date().toISOString().slice(0, 10)}.csv`, new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        showToast(`${cards.length} 件をCSVに書き出しました。`);
      } catch (error) { console.error(error); showToast(`CSV出力に失敗しました: ${error.message}`); }
    }
    async function importJSON(event) {
      const file = event.target.files?.[0];
      event.target.value = '';
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        const imported = Array.isArray(parsed) ? parsed : parsed?.cards;
        if (!Array.isArray(imported)) throw new Error('JSON配列、または cards 配列を含むバックアップを選んでください。');
        const existing = await getAllCards();
        const keys = new Set(existing.map(cardDuplicateKey));
        const ids = new Set(existing.map((card) => card.id));
        let added = 0, skipped = 0;
        const toAdd = [];
        for (const raw of imported) {
          const card = normalizeCard(raw);
          if (!card.term || !card.meaning || keys.has(cardDuplicateKey(card))) { skipped++; continue; }
          if (ids.has(card.id)) card.id = makeId();
          card.updatedAt = new Date().toISOString();
          keys.add(cardDuplicateKey(card)); ids.add(card.id); toAdd.push(card); added++;
        }
        await putCardRecords(toAdd);
        await refreshCards({ clearSelection: true });
        showToast(`インポート完了：追加 ${added} 件／重複・不備でスキップ ${skipped} 件`);
      } catch (error) {
        console.error(error);
        window.alert(`JSONを読み込めませんでした。\n${error.message}`);
      }
    }
    async function handleTextExtraction() {
      const textInput = $('textInput').value;
      if (!textInput.trim()) {
        window.alert('テキストを入力してください。');
        return;
      }

      const status = $('pdfStatus');
      status.className = 'status';
      status.textContent = 'AIが重要語句を抽出しています…';
      const extractBtn = $('extractWordsBtn');
      extractBtn.disabled = true;

      try {
        const response = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: textInput }) });
        const result = await response.json();
        if (!response.ok || result.error) throw new Error(result.error || `サーバーエラー (${response.status})`);
        if (!Array.isArray(result.cards)) throw new Error('AIから予期しない形式のデータが返されました。');
        
        const existing = await getAllCards();
        const keys = new Set(existing.map(cardDuplicateKey));
        let added = 0, skipped = 0;
        const toAdd = [];
        for (const item of result.cards) {
          const term = cleanText(item.term);
          const meaning = [cleanText(item.meaning), cleanText(item.example) ? `例文: ${cleanText(item.example)}` : ''].filter(Boolean).join('\n\n');
          if (!term || !meaning) { skipped++; continue; }
          const card = normalizeCard({ id: makeId(), term, meaning, category: 'AI抽出', tags: [], sourceName: 'テキスト入力', sourcePage: null, createdAt: new Date().toISOString() });
          const key = cardDuplicateKey(card);
          if (keys.has(key)) { skipped++; continue; }
          toAdd.push(card); keys.add(key); added++;
        }
        await putCardRecords(toAdd);
        await refreshCards({ clearSelection: true });
        status.className = 'status success';
        status.textContent = `完了：${added} 件を追加${skipped ? `、${skipped} 件は重複・不備のためスキップ` : ''}しました。`;
        $('textInput').value = ''; // Clear input on success
      } catch (error) {
        console.error(error);
        status.className = 'status error';
        status.textContent = `抽出に失敗しました：${error.message}`;
      } finally {
        extractBtn.disabled = false;
      }
    }

    $('addWordButton').addEventListener('click', () => openWordDialog());
    $('closeDialogButton').addEventListener('click', () => $('wordDialog').close());
    $('cancelDialogButton').addEventListener('click', () => $('wordDialog').close());
    $('wordForm').addEventListener('submit', saveWord);
    $('searchInput').addEventListener('input', () => { selectedIds.clear(); renderCards(); });
    $('categoryFilter').addEventListener('change', () => { selectedIds.clear(); renderCards(); });
    $('sortSelect').addEventListener('change', () => { selectedIds.clear(); renderCards(); });
    $('clearFiltersButton').addEventListener('click', clearFilters);
    $('selectAllCheckbox').addEventListener('change', (event) => {
      const visible = getFilteredCards();
      if (event.target.checked) selectedIds = new Set(visible.map((card) => card.id));
      else visible.forEach((card) => selectedIds.delete(card.id));
      renderCards();
    });
    $('bulkCategory').addEventListener('change', () => updateSelectionControls());
    $('moveSelectedButton').addEventListener('click', moveSelectedCards);
    $('deleteSelectedButton').addEventListener('click', deleteSelectedCards);
    $('undoButton').addEventListener('click', undoDelete);
    $('exportJsonButton').addEventListener('click', exportJSON);
    $('exportCsvButton').addEventListener('click', exportCSV);
    $('jsonInput').addEventListener('change', importJSON);
    $('extractWordsBtn').addEventListener('click', handleTextExtraction);

    (async function startApp() {
      try {
        await initDB();
        await refreshCards();
      } catch (error) {
        console.error(error);
        $('pdfStatus').className = 'status error';
        $('pdfStatus').textContent = `起動できませんでした：${error.message} ブラウザのサイトデータ設定を確認してください。`;
      }
      if ('serviceWorker' in navigator && /^https?:$/.test(window.location.protocol)) {
        navigator.serviceWorker.register('./sw.js').catch((error) => console.warn('Service Worker registration failed:', error));
      }
    })();
  </script>
</body>
</html>
